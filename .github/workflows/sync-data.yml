name: Sync dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  push:
    branches: [main]
    paths:
      - "scripts/sync.py"
      - ".github/workflows/sync-data.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and validate
        run: python scripts/sync.py

      - name: Commit if the upstream changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then ask git whether the index actually differs. Comparing
          # index to HEAD instead of using `git status` keeps this from tripping on
          # line-ending normalisation (the canonical CSV ships CRLF, this repo is LF).
          git add -A data
          if git diff --cached --quiet; then
            echo "Dataset unchanged upstream; nothing to commit."
            git status --porcelain data
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore: sync dataset from naming-cn.pages.dev"
          git push
